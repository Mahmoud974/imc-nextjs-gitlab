image: node:21

stages:
  - build
  - test
  - package
  - deploy

install:
  stage: build
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/

build:
  stage: build
  script:
    - npm run build    
    - npm run export   

test:
  stage: test
  script:
    - ls -al         

package:
  stage: package
  script:
    - ls -al  

build image:
  stage: package
  script:
    - docker build -t simachille/front-imc:latest .             
         

deploy:
  stage: deploy
  script:
   - ls -al 
    

